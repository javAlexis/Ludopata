server:
  port: 9100
  servlet:
    context-path: /capacitacion

spring:
  application:
    name: capacitacion
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: "12345678"
    driver-class-name: org.postgresql.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      fail-on-empty-beans: false
  jpa:
    show-sql: true
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        max_fetch_depth: 5
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_HOLD

logging:
  level:
    root: INFO
    org.latacunga.capacitacion: DEBUG

app:
  # Carpeta donde se buscan los .jasper compilados (admite prefijo "classpath:" para desarrollo;
  # en produccion usar una ruta absoluta del sistema de archivos)
  reportes: classpath:reportes/
  # Carpeta con las imagenes (logo, marca de agua, firmas) que se inyectan como parametros a los reportes
  imagenes: classpath:reportes/imagenes/
